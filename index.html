<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR-Wimax · Almacén</title>
<meta name="description" content="Sistema de gestión de inventarios con códigos QR — Importaciones Wimax E.I.R.L.">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --neg:#111111; --neg2:#1d1d1d; --am:#FBC305; --am2:#FFE07A; --amb:#FFF6D6;
  --bg:#F3F3F1; --card:#FFFFFF; --tx:#1A1A1A; --tx2:#5F5F5F; --ln:#E3E3E0;
  --ok:#2E7D32; --okb:#E7F4E8; --mal:#C00000; --malb:#FDECEC; --az:#1F4E79; --azb:#E8F0F8;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--az)}
.hide{display:none!important}
/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(circle at 50% 0%,#2a2a2a 0,#111 60%)}
.lbox{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lbox img{width:84px;height:84px;display:block;margin:0 auto 10px;border-radius:20px}
.lbox h1{margin:0;text-align:center;font-size:22px}
.lbox p.sub{margin:4px 0 20px;text-align:center;color:var(--tx2);font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin:12px 0 4px}
input.in,select.in{width:100%;padding:12px 13px;border:1.5px solid var(--ln);border-radius:11px;background:#fff;outline:none}
input.in:focus,select.in:focus{border-color:var(--am)}
.pin{letter-spacing:.5em;text-align:center;font-size:22px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--tx2)}
.err{color:var(--mal);font-size:14px;min-height:20px;margin-top:10px}
/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--am);color:var(--neg);text-decoration:none;min-height:46px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:default}
.btn.blk{width:100%}
.btn.sec{background:#fff;border:1.5px solid var(--ln);color:var(--tx)}
.btn.dark{background:var(--neg);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.mal{background:var(--malb);color:var(--mal)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ---------- marco ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--neg);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
header.top img{width:36px;height:36px;border-radius:9px}
header.top .t{flex:1;min-width:0}
header.top .t b{display:block;font-size:16px;line-height:1.1}
header.top .t span{font-size:12px;color:#bbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ib{background:transparent;border:0;color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:22px;height:22px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
main{padding:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
nav.bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2);text-decoration:none;padding:4px 0;border-radius:10px;min-width:0}
nav.bar a svg{width:24px;height:24px}
nav.bar a.on{color:var(--neg);font-weight:700}
nav.bar a.on svg{background:var(--am);border-radius:10px;padding:2px 10px;width:44px;box-sizing:content-box;margin:-2px 0}
nav.bar a.scan svg{background:var(--neg);color:var(--am);border-radius:50%;width:30px;height:30px;padding:9px;margin-top:-22px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
nav.bar a.scan.on svg{background:var(--am);color:var(--neg);width:30px;padding:9px}
@media (min-width:900px){
  nav.bar{top:56px;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--ln);padding:14px 10px;gap:4px}
  nav.bar a{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px}
  nav.bar a.on{background:var(--amb)}
  nav.bar a.on svg,nav.bar a.scan svg,nav.bar a.scan.on svg{background:none;color:inherit;padding:0;width:24px;height:24px;margin:0;box-shadow:none}
  main{margin-left:210px;padding:24px 28px 40px;max-width:none}
  .wrap{max-width:1040px}
}
h2.pt{margin:2px 0 14px;font-size:22px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.muted{color:var(--tx2)}
small,.sm{font-size:13px}
/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:13px 14px;border-left:5px solid var(--am);cursor:default}
.kpi.lk{cursor:pointer}
.kpi .v{font-size:clamp(19px,5.6vw,27px);overflow-wrap:anywhere;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--tx2);margin-top:2px}
.kpi.ok{border-color:var(--ok)}.kpi.mal{border-color:var(--mal)}.kpi.az{border-color:var(--az)}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.two>*,.kpis>*,.grid2>*{min-width:0}
html,body{overflow-x:hidden}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
/* ---------- listas ---------- */
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;overflow-wrap:anywhere}
.li .m span{font-size:13px;color:var(--tx2)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:#eee;color:#333;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-mal{background:var(--malb);color:var(--mal)}.b-am{background:var(--amb);color:#7a5a00}.b-az{background:var(--azb);color:var(--az)}.b-neg{background:var(--neg);color:var(--am)}
.num{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px;text-align:right;min-width:44px}
.ubi{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;background:var(--neg);color:var(--am);border-radius:7px;padding:3px 7px;font-size:12.5px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.chip{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:7px 13px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--neg);border-color:var(--neg);color:#fff}
.grp{margin-bottom:12px}
.grp .gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.grp .gh b{font-size:15px}
.empty{text-align:center;color:var(--tx2);padding:26px 10px}
.seg{display:flex;background:#e9e9e6;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;cursor:pointer;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--tx2);font-weight:600;border-bottom:1.5px solid var(--ln);padding:7px 6px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--ln);padding:8px 6px;vertical-align:top}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;max-height:420px;overflow-y:auto}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--ln);border-radius:10px;overflow:hidden}
.step button{border:0;background:#f4f4f2;width:36px;height:36px;font-size:19px;cursor:pointer}
.step input{width:54px;border:0;text-align:center;height:36px;font-weight:700;outline:none}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:20px}}
.mh{position:sticky;top:0;background:var(--neg);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.mh .t{flex:1;min-width:0}.mh .t b{font-size:17px;display:block}.mh .t span{font-size:13px;color:#ccc}
.mb{padding:14px 16px}
.big{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;max-width:92vw;width:max-content;background:var(--neg);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.v{opacity:1}#toast.e{background:var(--mal)}#toast.o{background:var(--ok)}
/* ---------- escáner ---------- */
#reader{width:100%;max-width:440px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000}
#reader video{width:100%!important;display:block}
.scanmsg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14.5px;background:#f0f0ee;min-height:20px}
.scanmsg.o{background:var(--okb);color:var(--ok)}.scanmsg.e{background:var(--malb);color:var(--mal)}
/* ---------- gráficos ---------- */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px dashed;vertical-align:middle;margin-right:5px}
/* ---------- etiquetas (impresión) ---------- */
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:grid!important;grid-template-columns:repeat(3,1fr);gap:4mm;padding:0}
  .lab{border:1px dashed #999;padding:3mm;text-align:center;break-inside:avoid;font-family:Arial,sans-serif}
  .lab svg{width:32mm;height:32mm}
  .lab b{display:block;font-size:10pt}.lab span{display:block;font-size:8.5pt}
  @page{margin:10mm}
}
.labprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.labprev .lab{background:#fff;border:1px dashed #bbb;border-radius:10px;padding:10px;text-align:center;font-size:12px}
.labprev .lab svg{width:110px;height:110px}
.labprev .lab b{display:block;font-size:13px}
</style>
</head>
<body>

<!-- =================== INGRESO =================== -->
<section id="login">
  <form class="lbox" id="flogin" autocomplete="off">
    <img src="icon-192.png" alt="">
    <h1>QR-Wimax</h1>
    <p class="sub">Gestión de inventarios con códigos QR<br>Importaciones Wimax E.I.R.L.</p>
    <label class="f" for="lnom">Su nombre</label>
    <input class="in" id="lnom" maxlength="40" placeholder="Ej.: Héctor" required>
    <label class="f" for="lpin">Clave</label>
    <input class="in pin" id="lpin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" required>
    <label class="chk"><input type="checkbox" id="lrec" checked> Recordarme en este celular</label>
    <div class="err" id="lerr"></div>
    <button class="btn blk" id="lbtn" type="submit">Ingresar</button>
  </form>
</section>

<!-- =================== APLICACIÓN =================== -->
<section id="app" class="hide">
  <header class="top">
    <img src="icon-192.png" alt="">
    <div class="t"><b>QR-Wimax</b><span id="hsub"></span></div>
    <button class="ib" id="brefresh" title="Actualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="ib" id="bsalir" title="Salir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
  </header>
  <nav class="bar" id="nav"></nav>
  <main><div class="wrap" id="view"></div></main>
</section>

<div id="toast"></div>
<div id="modal"></div>
<div id="print"></div>
<input id="fotoin" type="file" accept="image/*" capture="environment" class="hide">

<script>
/* =====================================================================
   QR-Wimax · página web del almacén
   Datos: Google Sheets (Sistema_QR_Wimax) a través de Apps Script.
   La clave NUNCA está en este archivo: la valida Apps Script.
   ===================================================================== */
const API = 'https://script.google.com/macros/s/AKfycbzgnNM951WEcNXd2YURehWf8T4XjVP-vkEhYfuri2sbAnIuyq3VsRJt-wzo_wzwQT5a5Q/exec';
const META = 17, BASE = 24;           // minutos: meta del proyecto y línea base
const LIB_QR = ['https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js','https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'];
const LIB_GEN = ['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = v => Number(v) || 0;
const fmtN = v => n0(v).toLocaleString('es-PE');
const fmtS = v => 'S/ ' + n0(v).toLocaleString('es-PE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtMin = v => v == null || isNaN(v) ? '—' : (Math.round(v * 10) / 10).toLocaleString('es-PE') + ' min';
const dt = s => s ? new Date(s) : null;
const fFecha = s => { const d = dt(s); return d && !isNaN(d) ? d.toLocaleDateString('es-PE', {day: '2-digit', month: '2-digit', year: '2-digit'}) + ' ' + d.toLocaleTimeString('es-PE', {hour: '2-digit', minute: '2-digit'}) : ''; };
const diaKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoyKey = () => diaKey(new Date());
const tipoDe = u => u <= 2 ? 'U' : (u < 60 ? 'M' : 'G');
const TIPO = {U: 'Unitario', M: 'Mediano', G: 'Grande'};
const ls = {get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
            del(k) { try { localStorage.removeItem(k); } catch (e) {} }};
const ss_ = {get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
             set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
             del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }};
function toast(t, tipo) { const el = $('#toast'); el.textContent = t; el.className = 'v ' + (tipo || ''); clearTimeout(toast.h); toast.h = setTimeout(() => el.className = '', tipo === 'e' ? 5000 : 3200); }
function beep(f) { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); g.gain.value = .15; o.start(); setTimeout(() => { o.stop(); c.close(); }, 140); } catch (e) {} }
function vib(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function cargarLib(urls, glob) {
  if (window[glob]) return Promise.resolve();
  return urls.reduce((p, u) => p.catch(() => new Promise((ok, no) => { const s = document.createElement('script'); s.src = u; s.onload = () => window[glob] ? ok() : no(); s.onerror = no; document.head.appendChild(s); })), Promise.reject())
    .catch(() => { throw new Error('No se pudo cargar una librería. Revise su conexión a internet.'); });
}
function confirmar(btn, texto, fn) {           // doble toque para confirmar (sin ventanas emergentes)
  if (btn.dataset.c === '1') { btn.dataset.c = ''; btn.textContent = btn.dataset.t; fn(); return; }
  btn.dataset.t = btn.textContent; btn.dataset.c = '1'; btn.textContent = texto;
  setTimeout(() => { if (btn.dataset.c === '1') { btn.dataset.c = ''; btn.textContent = btn.dataset.t; } }, 4000);
}
const ICON = {
  inicio: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  inventario: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  pedido: '<path d="M9 5h6M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1z"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M12 11v6M9 14h6"/>',
  pedidos: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
  escanear: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/><path d="M13 7h4v4M7 13v4h4"/>',
  reportes: '<path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/>',
  etiquetas: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'
};
const svgI = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + '</svg>';

/* ---------- estado ---------- */
const S = {pin: '', usuario: '', rol: '', productos: [], pedidos: [], ahora: '', vista: 'inicio', cargando: false, rep: null};
const P = code => S.productos.find(p => p.code === code);
const nomP = p => p ? p.modelo + ' – ' + p.color : '';

/* ---------- conexión con Apps Script ---------- */
async function api(action, extra) {
  const body = Object.assign({action, pin: S.pin, usuario: S.usuario}, extra || {});
  let r;
  try {
    r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect: 'follow'});
  } catch (e) { throw new Error('Sin conexión con la base de datos. Revise su internet.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('La base de datos no respondió bien. Verifique que Apps Script esté implementado (versión 6).'); }
  if (!j.ok) { if (j.error === 'Clave incorrecta.' && action !== 'login') salir(); throw new Error(j.error || 'Error desconocido.'); }
  return j;
}
async function cargar(silencio) {
  if (S.cargando) return; S.cargando = true; $('#brefresh svg').classList.add('spin');
  try {
    const d = await api('datos');
    S.productos = d.productos || []; S.pedidos = d.pedidos || []; S.ahora = d.ahora; S.rol = d.rol || S.rol;
    ls.set('wimaxCache', {productos: S.productos, pedidos: S.pedidos, t: Date.now()});
    render();
    if (!silencio) toast('Datos actualizados', 'o');
  } catch (e) { if (!silencio) toast(e.message, 'e'); }

function estadisticas(peds) {
  const ent = peds.filter(p => p.estado === 'Entregado' && p.minutos != null && !isNaN(p.minutos));
  const prom = a => a.length ? a.reduce((s, p) => s + p.minutos, 0) / a.length : null;
  const porTipo = {}; ['U', 'M', 'G'].forEach(t => { const a = ent.filter(p => p.tipo === t); porTipo[t] = {n: a.length, prom: prom(a)}; });
  return {ent, prom: prom(ent), porTipo, enMeta: ent.length ? ent.filter(p => p.minutos <= META).length / ent.length * 100 : null};
}

function dibBarras(sel, datos, compacto) {
  const W = 520, H = compacto ? 190 : 210, L = 34, R = 10, T = 14, B = 34;
  const max = Math.max(BASE + 4, ...datos.map(d => d.v || 0)) * 1.08;
  const y = v => T + (H - T - B) * (1 - v / max), bw = (W - L - R) / datos.length;

  for (let g = 0; g <= max; g += (max > 40 ? 10 : 5)) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="#ececea"/><text x="' + (L - 6) + '" y="' + (y(g) + 4) + '" font-size="11" text-anchor="end" fill="#888">' + g + '</text>';
  datos.forEach((d, i) => {
    const x = L + i * bw + bw * .2, w = bw * .6;
    if (d.v != null) {
      const c = d.v <= META ? '#2E7D32' : (d.v <= BASE ? '#FBC305' : '#C00000');
      s += '<rect x="' + x + '" y="' + y(d.v) + '" width="' + w + '" height="' + (y(0) - y(d.v)) + '" rx="5" fill="' + c + '"/>' +
           '<text x="' + (x + w / 2) + '" y="' + (y(d.v) - 5) + '" font-size="12.5" font-weight="700" text-anchor="middle" fill="#222" stroke="#fff" stroke-width="4" paint-order="stroke">' + (Math.round(d.v * 10) / 10) + '</text>';
    } else s += '<text x="' + (x + w / 2) + '" y="' + (y(0) - 6) + '" font-size="11" text-anchor="middle" fill="#aaa">sin datos</text>';
    s += '<text x="' + (x + w / 2) + '" y="' + (H - B + 16) + '" font-size="12" text-anchor="middle" fill="#444">' + esc(d.l) + '</text>' +
         (compacto ? '' : '<text x="' + (x + w / 2) + '" y="' + (H - B + 30) + '" font-size="10.5" text-anchor="middle" fill="#999">' + d.n + ' ped.</text>');
  });
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(META) + '" y2="' + y(META) + '" stroke="#2E7D32" stroke-width="2" stroke-dasharray="6 4"/>' +
       '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(BASE) + '" y2="' + y(BASE) + '" stroke="#C00000" stroke-width="2" stroke-dasharray="6 4"/>' +
       '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#bbb"/></svg>';
  $(sel).innerHTML = s;
}

function filtrarProd(q, fam, estado) {

function setMult(d) { escS.mult = Math.max(1, escS.mult + d); $('#emult').value = escS.mult; guardarEsc(); }
function msgEsc(t, c) { const m = $('#emsg'); if (m) { m.innerHTML = t; m.className = 'scanmsg ' + (c || ''); } }
function leido(code) {
  const p = P(code);
  if (!p) { beep(220); vib([60, 60, 60]); msgEsc('Código no registrado: <b>' + esc(code) + '</b>', 'e'); return; }
  beep(880); vib(70);

  escS.items[code] = (escS.items[code] || 0) + escS.mult; guardarEsc(); renderLista();

        '<td class="r"><div class="step"><button onclick="ajEsc(\'' + esc(k) + '\',-1)">−</button><input type="number" value="' + q + '" onchange="fijEsc(\'' + esc(k) + '\',this.value)"><button onclick="ajEsc(\'' + esc(k) + '\',1)">+</button></div></td></tr>'; }).join('') + '</table></div>'

function ajEsc(k, d) { escS.items[k] = (escS.items[k] || 0) + d; if (escS.items[k] <= 0) delete escS.items[k]; guardarEsc(); renderLista(); }
function fijEsc(k, v) { const q = Math.floor(n0(v)); if (q <= 0 && escS.modo !== 'Conteo') delete escS.items[k]; else escS.items[k] = Math.max(0, q); guardarEsc(); renderLista(); }

async function iniciarCam() {
  const b = $('#bcam'); b.disabled = true; b.textContent = 'Abriendo cámara...';

    await cargarLib(LIB_QR, 'Html5Qrcode');
    if (!escCam.qr) escCam.qr = new Html5Qrcode('reader');
    await escCam.qr.start({facingMode: 'environment'}, {fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * .7); return {width: s, height: s}; }},
      t => { const c = parseQR(t), now = Date.now();
        if (escCam.pausada) return;
        if (c === escCam.last && now - escCam.lastT < 2200) return;     // evita sumar dos veces el mismo QR
        escCam.last = c; escCam.lastT = now; leido(c); }, () => {});
    escCam.activa = true; b.textContent = '⏹ Detener cámara'; b.classList.add('dark');
  } catch (e) {
    escCam.activa = false; b.textContent = '📷 Abrir cámara';

function detenerCam() {
  if (escCam.qr && escCam.activa) { escCam.qr.stop().catch(() => {}); }

      '<div class="row" style="margin-bottom:10px"><input class="in grow" id="rq" type="search" placeholder="Filtrar por código, vendedor o texto" value="' + esc(filRep.q) + '"><button class="btn sm dark" id="rcsv">⬇ Excel (CSV)</button></div><div id="rtabla"></div></div>';
  dibBarras('#rch', ['U', 'M', 'G'].map(t => ({l: TIPO[t], v: st.porTipo[t].prom, n: st.porTipo[t].n})));
  const tablas = {
    pedidos: {cols: ['ID', 'Fecha', 'Vendedor', 'Tipo', 'Unidades', 'Modelos', 'Estado', 'Minutos', 'Detalle'], filas: peds.map(p => [p.id, fFecha(p.fecha), p.vendedor, p.tipo, p.unidades, p.modelos, p.estado, p.minutos == null ? '' : p.minutos, p.detalle])},
    movimientos: {cols: ['Fecha', 'Código', 'Producto', 'Tipo', 'Cantidad', 'Origen'], filas: movs.slice().reverse().map(m => [fFecha(m.fecha), m.code, nomP(P(m.code)), m.tipo, m.cantidad, m.origen])},
    perdidas: {cols: ['Fecha', 'Vendedor', 'Código', 'Producto', 'Cantidad', 'Valor S/'], filas: per.slice().reverse().map(x => [fFecha(x.fecha), x.vendedor, x.code, x.producto, x.cantidad, x.valor])},
    conteos: {cols: ['Fecha', 'ID conteo', 'Código', 'Producto', 'Sistema', 'Contado', 'Diferencia'], filas: con.slice().reverse().map(x => [fFecha(x.fecha), x.id, x.code, x.producto, x.sistema, x.contado, x.diferencia])}
  };
  const pintarTabla = () => {
    const T = tablas[filRep.tab], q = filRep.q.toLowerCase(), F = q ? T.filas.filter(f => f.join(' ').toLowerCase().includes(q)) : T.filas;
    const numCol = i => typeof (T.filas[0] || [])[i] === 'number';
    $('#rtabla').innerHTML = F.length ? '<div class="tw"><table class="t"><tr>' + T.cols.map((c, i) => '<th' + (numCol(i) ? ' class="r"' : '') + '>' + c + '</th>').join('') + '</tr>' +
      F.slice(0, 300).map(f => '<tr>' + f.map((v, i) => '<td' + (numCol(i) ? ' class="r"' : '') + '>' + esc(v) + '</td>').join('') + '</tr>').join('') + '</table></div>' +
      '<div class="muted sm" style="margin-top:6px">' + F.length + ' registros' + (F.length > 300 ? ' (se muestran 300; el archivo Excel trae todos)' : '') + '</div>' : '<div class="empty">Sin registros en el periodo.</div>';
    $('#rcsv').onclick = () => descargarCSV('wimax_' + filRep.tab + '_' + filRep.desde + '_' + filRep.hasta + '.csv', T.cols, F);
  };
  $$('#rtab button').forEach(b => b.onclick = () => { filRep.tab = b.dataset.t; $$('#rtab button').forEach(x => x.classList.toggle('on', x === b)); pintarTabla(); });
  $('#rq').oninput = e => { filRep.q = e.target.value; pintarTabla(); };
  pintarTabla();
}
function descargarCSV(nombre, cols, filas) {
  const c = v => { v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const txt = '﻿' + [cols, ...filas].map(f => f.map(c).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'})); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =================== ETIQUETAS QR (supervisor) =================== */
const selEt = new Set();
function vEtiquetas() {
  $('#view').innerHTML = '<h2 class="pt">Etiquetas QR</h2>' +
    '<div class="card"><div class="muted sm" style="margin-bottom:8px">Elija los productos y toque Imprimir. Cada QR abre esta página con la ficha del producto, y el escáner también lo lee.</div>' +
    '<input class="in" id="eq" type="search" placeholder="Filtrar productos"><div class="row" style="margin:10px 0"><button class="btn sm sec" id="etodo">Marcar todos</button><button class="btn sm sec" id="enada">Quitar todos</button><span class="grow"></span><button class="btn sm dark" id="eimp">🖨 Imprimir (<span id="ecnt">0</span>)</button></div>' +
    '<div id="elst"></div></div><div class="card"><h3>Vista previa</h3><div class="labprev" id="eprev"></div></div>';
  const pint = () => {
    const L = filtrarProd($('#eq').value);
    $('#elst').innerHTML = L.map(p => '<label class="li" style="cursor:pointer"><input type="checkbox" data-c="' + esc(p.code) + '" ' + (selEt.has(p.code) ? 'checked' : '') + ' style="width:20px;height:20px"><span class="ubi">' + esc(p.ub) + '</span><div class="m"><b>' + esc(nomP(p)) + '</b><span>' + esc(p.code) + '</span></div></label>').join('');
    $$('#elst input').forEach(c => c.onchange = () => { c.checked ? selEt.add(c.dataset.c) : selEt.delete(c.dataset.c); prev(); });
    prev();
  };
  const prev = async () => {
    $('#ecnt').textContent = selEt.size;
    const L = [...selEt].map(P).filter(Boolean);
    if (!L.length) { $('#eprev').innerHTML = '<div class="muted sm">Sin productos elegidos.</div>'; return; }
    try { await cargarLib(LIB_GEN, 'qrcode'); } catch (e) { $('#eprev').innerHTML = '<div class="muted sm">' + esc(e.message) + '</div>'; return; }
    $('#eprev').innerHTML = L.slice(0, 12).map(etiquetaHtml).join('') + (L.length > 12 ? '<div class="muted sm">… y ' + (L.length - 12) + ' más</div>' : '');
  };
  $('#eq').oninput = pint;
  $('#etodo').onclick = () => { filtrarProd($('#eq').value).forEach(p => selEt.add(p.code)); pint(); };
  $('#enada').onclick = () => { selEt.clear(); pint(); };
  $('#eimp').onclick = async () => {
    const L = [...selEt].map(P).filter(Boolean); if (!L.length) return toast('Elija al menos un producto', 'e');
    try { await cargarLib(LIB_GEN, 'qrcode'); } catch (e) { return toast(e.message, 'e'); }
    $('#print').innerHTML = L.map(etiquetaHtml).join(''); setTimeout(() => print(), 200);
  };
  pint();
}
function etiquetaHtml(p) {
  const url = location.origin + location.pathname + '?code=' + encodeURIComponent(p.code);
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  return '<div class="lab">' + q.createSvgTag({cellSize: 4, margin: 2, scalable: true}) + '<b>' + esc(p.code) + '</b><span>' + esc(nomP(p)) + '</span><span>Ubic. ' + esc(p.ub) + '</span></div>';
}

(function () {
  const ses = ls.get('wimaxSesion', null) || ss_.get('wimaxSesion');
  if (ses && ses.pin) { S.pin = ses.pin; S.usuario = ses.usuario; S.rol = ses.rol; entrar(); }
  else { const q = new URLSearchParams(location.search).get('code'); if (q) $('#lerr').textContent = 'Ingrese para ver el producto ' + q.toUpperCase() + '.'; }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
